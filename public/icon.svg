<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <!-- Background rounded box -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Soccer Ball -->
  <g transform="translate(256, 256)">
    <!-- Main Ball Circle -->
    <circle r="180" fill="#ffffff" stroke="#0f172a" stroke-width="8"/>
    
    <!-- Central Pentagon -->
    <polygon points="0,-60 57,-18 35,48 -35,48 -57,-18" fill="#0f172a"/>
    
    <!-- Lines to Outer Pentagons -->
    <line x1="0" y1="-60" x2="0" y2="-125" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
    <line x1="57" y1="-18" x2="118" y2="-38" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
    <line x1="35" y1="48" x2="73" y2="108" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
    <line x1="-35" y1="48" x2="-73" y2="108" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
    <line x1="-57" y1="-18" x2="-118" y2="-38" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>

    <!-- Top Pentagon patch -->
    <polygon points="0,-125 -42,-162 -26,-178 26,-178 42,-162" fill="#0f172a"/>

    <!-- Top Right Pentagon patch -->
    <polygon points="118,-38 165,-12 177,-58 142,-100 110,-90" fill="#0f172a"/>

    <!-- Bottom Right Pentagon patch -->
    <polygon points="73,108 126,128 160,95 158,50 118,62" fill="#0f172a"/>

    <!-- Bottom Left Pentagon patch -->
    <polygon points="-73,108 -126,128 -160,95 -158,50 -118,62" fill="#0f172a"/>

    <!-- Top Left Pentagon patch -->
    <polygon points="-118,-38 -165,-12 -177,-58 -142,-100 -110,-90" fill="#0f172a"/>

    <!-- Outer rim curve overlay for spherical depth -->
    <circle r="180" fill="none" stroke="#10b981" stroke-width="12" opacity="0.8"/>
  </g>
</svg>
